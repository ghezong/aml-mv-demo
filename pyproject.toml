[project]
name = "aml-mv-demo"
version = "0.1.0"
description = "Synthetic AML rule engine and model validation portfolio demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
